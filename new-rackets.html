<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Rackets | PadelMarket</title>
<link rel="stylesheet" href="assets/fonts/saira.css">
<link rel="stylesheet" href="assets/common.css">
</head>
<body class="inner">

<!-- BANNER -->
<section class="banner dk on-dark">
  <div class="ph" data-scene="day" data-src="images/rackets-topdown-court.jpg" data-pos="50% 45%"></div>
  <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>New Rackets</span></nav>
  <h1>New Rackets</h1>
  <p>Brand-new padel rackets for every level and playing style. 100% authentic, with manufacturer warranty and tracked shipping across Australia.</p>
</section>

<!-- COLLECTION: filters left · grid right -->
<section class="coll wrap">
  <aside class="side" id="side" aria-label="Filters"></aside>
  <div>
    <div class="toolbar">
      <span class="cnt" id="count"></span>
      <div class="r">
        <button class="btn btn-line btn-sm filter-btn" id="openFilters" type="button">Filters</button>
        <label class="sr" for="sort">Sort by</label><select class="sel" id="sort"></select>
        <div class="cols" id="cols" aria-label="Grid columns"></div>
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
    <div class="pager" id="pager"></div>
  </div>
</section>

<!-- CTA STRIP -->
<section class="cta-strip">
  <svg class="deco" style="left:4%;bottom:-30px;width:110px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#D7F54A"/><path d="M14 22c22 14 22 42 0 56M86 22c-22 14-22 42 0 56" fill="none" stroke="#fff" stroke-width="4"/></svg>
  <h3>Prefer pre-loved?</h3>
  <p>Browse second-hand rackets listed by players across Australia.</p>
  <a href="second-hand.html" class="btn btn-blue">Browse second-hand</a>
</section>

<!-- SHOP BY SHAPE -->
<section class="wrap" style="padding-top:80px">
  <div class="sh"><div class="wm">Shapes</div><h2>Shop by Shape</h2><div class="dv">✦</div></div>
  <div class="cats" id="cats"></div>
</section>

<div id="pmFooter"></div>

<script src="assets/app.js"></script>
<script src="assets/collection.js"></script>
<script>
PM.header({active:'new'});
PM.footer();
const {NEW}=PM;
const C=PM.collection({
  items:NEW,noun:'rackets',perPage:9,priceAt:1,
  priceOf:p=>p.price,card:PM.productCard,
  groups:[
    {key:'availability',label:'Availability',get:p=>p.stock?'In stock':'Out of stock',options:['In stock','Out of stock']},
    {key:'brand',label:'Brand',get:p=>p.brand},
    {key:'shape',label:'Shape',get:p=>p.shape,options:['Round','Teardrop','Hybrid','Diamond']},
    {key:'level',label:'Skill level',get:p=>p.level,options:PM.LEVELS},
    {key:'game',label:'Playing style',get:p=>p.game,options:['Control','All-round','Attack']}
  ],
  sorts:{
    featured:{label:'Featured',fn:()=>0},
    newest:{label:'Newest',fn:(a,b)=>new Date(b.added)-new Date(a.added)},
    'price-asc':{label:'Price, low to high',fn:(a,b)=>a.price-b.price},
    'price-desc':{label:'Price, high to low',fn:(a,b)=>b.price-a.price},
    'az':{label:'Alphabetically, A to Z',fn:(a,b)=>(a.brand+a.name).localeCompare(b.brand+b.name)},
    'za':{label:'Alphabetically, Z to A',fn:(a,b)=>(b.brand+b.name).localeCompare(a.brand+a.name)}
  }
});
const shapes=[['Round','adidas-cross-it-light'],['Teardrop','oxdog-ultimate-trio'],['Hybrid','nox-next-gen-white'],['Diamond','bullpadel-neuron-orange']];
$('#cats').innerHTML=shapes.map(([n,img])=>`<button class="cat" data-shape="${n}"><span class="c"><img src="images/rackets/${img}.webp" alt=""></span><span>${n}<small>${NEW.filter(p=>p.shape===n).length} rackets</small></span></button>`).join('')
  +`<a class="cat" href="second-hand.html"><span class="c"><img src="images/rackets/nox-at10.webp" alt=""></span><span>Pre-loved<small>${PM.listings().length} listings</small></span></a>`;
$('#cats').onclick=e=>{const b=e.target.closest('[data-shape]');if(b)C.select('shape',b.dataset.shape)};
PM.fillPh();
</script>
</body>
</html>
